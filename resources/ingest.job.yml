# Daily ingestion: fetch raw files to the landing volume, run the lakehouse pipeline
# (bronze loads the new files; silver and gold refresh from bronze), then check the data
# quality results for the same window, and finally update the feature tables (the features
# job). A failed task, including a day with data quality issues, fails the run and emails
# the deploying user; features aren't updated from a load that failed its checks.
#
# With no parameters it re-fetches the last few days (incremental). For a backfill:
#   databricks bundle run ingest --params start_date=2025-03-01,end_date=2025-11-30
resources:
  jobs:
    ingest:
      name: ingest
      tags:
        project: databucs
      performance_target: STANDARD # daily batch, no deadline
      max_concurrent_runs: 1 # two runs writing the same landing files would race
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: start_date
          default: ""
        - name: end_date
          default: ""
      schedule:
        # Morning after games, Eastern time. Paused for the off-season; unpause before
        # opening day. (Development mode always pauses schedules.)
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED
      tasks:
        - task_key: fetch_raw
          environment_key: default
          python_wheel_task:
            package_name: databucs
            entry_point: fetch-raw
            parameters:
              - --landing-path=/Volumes/${var.catalog}/${resources.schemas.bronze.name}/landing
              - --start-date={{job.parameters.start_date}}
              - --end-date={{job.parameters.end_date}}
        - task_key: run_lakehouse
          depends_on:
            - task_key: fetch_raw
          pipeline_task:
            pipeline_id: ${resources.pipelines.lakehouse.id}
        - task_key: check_data_quality
          depends_on:
            - task_key: run_lakehouse
          environment_key: default
          python_wheel_task:
            package_name: databucs
            entry_point: check-data-quality
            parameters:
              - --catalog=${var.catalog}
              - --silver-schema=${resources.schemas.silver.name}
              - --start-date={{job.parameters.start_date}}
              - --end-date={{job.parameters.end_date}}
        - task_key: update_features
          depends_on:
            - task_key: check_data_quality
          run_job_task:
            job_id: ${resources.jobs.features.id}
            job_parameters:
              start_date: "{{job.parameters.start_date}}"
              end_date: "{{job.parameters.end_date}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "4" # serverless environment; Python 3.12, matching local dev
            dependencies:
              - ../dist/*.whl
