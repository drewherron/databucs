# Lakeflow declarative pipeline for the medallion tables. Bronze tables load new landing
# files incrementally with Auto Loader. Tables are published to the bronze schema by default;
# silver and gold tables use fully qualified names built from the configuration below.
resources:
  pipelines:
    lakehouse:
      name: lakehouse
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      continuous: false
      configuration:
        landing_path: /Volumes/${var.catalog}/${resources.schemas.bronze.name}/landing
        catalog: ${var.catalog}
        silver_schema: ${resources.schemas.silver.name}
        gold_schema: ${resources.schemas.gold.name}
      libraries:
        - glob:
            include: ../src/pipelines/lakehouse/**
