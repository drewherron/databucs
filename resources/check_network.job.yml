# Reports which external data sources serverless compute can reach. Run on demand;
# the results decide whether ingestion can fetch data from inside Databricks.
resources:
  jobs:
    check_network:
      name: check_network
      tags:
        project: databucs
      performance_target: STANDARD # run on demand, nothing waits on it
      tasks:
        - task_key: check_network
          environment_key: default
          spark_python_task:
            python_file: ../src/databucs/jobs/check_network.py
      environments:
        - environment_key: default
          spec:
            environment_version: "4" # serverless environment; Python 3.12, matching local dev
