# Train, evaluate and register the five pitch outcome models (see
# src/databucs/models/outcomes.py), one for_each iteration per model, all in parallel.
# Then combine the champions into expected run value and evaluate it on the test season
# (src/databucs/jobs/evaluate_outcome_models.py), and backtest the recommender's core claim
# within situations (src/databucs/jobs/backtest_recommender.py).
# Each run is logged to the outcome_models MLflow experiment (experiments.yml) and registered in Unity Catalog as
# <catalog>.<ml schema>.outcome_<model>. A new version becomes @champion only if it beats
# the current champion's test log loss (otherwise @challenger), unless promote=always.
#
#   databricks bundle run train_outcome_models
#   databricks bundle run train_outcome_models --params promote=always   # model inputs changed
#   databricks bundle run train_outcome_models --params 'models=["swing"]'  # just one model
#   databricks bundle run train_outcome_models --params sample_percent=10   # quick trial
resources:
  jobs:
    train_outcome_models:
      name: train_outcome_models
      tags:
        project: databucs
      performance_target: STANDARD
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      parameters:
        - name: train_seasons
          default: "2023,2024,2025"
        - name: test_season
          default: "2026"
        - name: sample_percent
          default: "100"
        - name: promote
          default: if_better # or "always"
        - name: models
          default: '["swing", "take_outcome", "whiff", "contact_outcome", "in_play_outcome"]'
      tasks:
        - task_key: train
          for_each_task:
            inputs: "{{job.parameters.models}}"
            concurrency: 5 # Free Edition allows 5 concurrent tasks
            task:
              task_key: train_model
              environment_key: training
              max_retries: 0 # a retry repeats a long training run and registers another version
              python_wheel_task:
                package_name: databucs
                entry_point: train-outcome-model
                parameters:
                  - --model={{input}}
                  - --catalog=${var.catalog}
                  - --gold-schema=${resources.schemas.gold.name}
                  - --ml-schema=${resources.schemas.ml.name}
                  - --experiment=${resources.experiments.outcome_models.name}
                  - --train-seasons={{job.parameters.train_seasons}}
                  - --test-season={{job.parameters.test_season}}
                  - --sample-percent={{job.parameters.sample_percent}}
                  - --promote={{job.parameters.promote}}
        - task_key: evaluate_expected_run_value
          depends_on:
            - task_key: train
          environment_key: training
          max_retries: 0
          python_wheel_task:
            package_name: databucs
            entry_point: evaluate-outcome-models
            parameters:
              - --catalog=${var.catalog}
              - --gold-schema=${resources.schemas.gold.name}
              - --ml-schema=${resources.schemas.ml.name}
              - --experiment=${resources.experiments.outcome_models.name}
              - --train-seasons={{job.parameters.train_seasons}}
              - --test-season={{job.parameters.test_season}}
        # Within the same situation, do pitches rated better give up fewer runs?
        # (src/databucs/models/backtest.py)
        - task_key: backtest_recommender
          depends_on:
            - task_key: evaluate_expected_run_value
          environment_key: training
          max_retries: 0
          python_wheel_task:
            package_name: databucs
            entry_point: backtest-recommender
            parameters:
              - --catalog=${var.catalog}
              - --gold-schema=${resources.schemas.gold.name}
              - --ml-schema=${resources.schemas.ml.name}
              - --experiment=${resources.experiments.outcome_models.name}
      environments:
        - environment_key: training
          spec:
            environment_version: "4" # serverless environment; Python 3.12, matching local dev
            dependencies:
              - ../dist/*.whl
              - databricks-feature-engineering==0.18.4
              - lightgbm==4.7.0
              - mlflow==3.18.0
