[project]
name = "databucs"
version = "0.1.0"
description = "Advance-scouting pitch recommendations and matchup rankings on Databricks."
readme = "README.md"
requires-python = "==3.12.*" # matches Databricks serverless
dependencies = []

[project.scripts]
fetch-raw = "databucs.jobs.fetch_raw:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databucs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
