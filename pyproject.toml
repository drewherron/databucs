[project]
name = "databucs"
version = "0.1.0"
description = "Advance-scouting pitch recommendations and matchup rankings on Databricks."
readme = "README.md"
requires-python = "==3.12.*" # matches Databricks serverless
dependencies = []

[project.scripts]
fetch-raw = "databucs.jobs.fetch_raw:main"
check-data-quality = "databucs.jobs.check_data_quality:main"
build-features = "databucs.jobs.build_features:main"
check-features = "databucs.jobs.check_features:main"
train-outcome-model = "databucs.jobs.train_outcome_model:main"
evaluate-outcome-models = "databucs.jobs.evaluate_outcome_models:main"

[dependency-groups]
dev = [
    "numpy>=2",
    "pandas>=2.2",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/databucs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
